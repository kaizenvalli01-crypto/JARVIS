name: Build JARVIS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      # JARVIS.exe needs the DLLs and data folder next to it, so ship the whole folder.
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release out/JARVIS
          Compress-Archive -Path out/JARVIS -DestinationPath JARVIS-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-windows
          path: JARVIS-windows.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk JARVIS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-android
          path: JARVIS.apk
